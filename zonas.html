<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <title>JSJ Structural Mapper v7.0 - Primary Graviticas</title>
    <style>
        :root {
            --accent: #3aa3ff;
            --bg: #0f1115;
            --panel: #161a22;
            --ink: #e8ecf1;
            --ok: #2ecc71;
            --bad: #e74c3c;
            --heat: #ff4757;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* UI Base */
        .toolbar {
            background: var(--panel);
            padding: 10px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid #242936;
            align-items: center;
            flex-wrap: wrap;
            z-index: 100;
            user-select: none;
        }

        /* Layout Fix: Canvas takes full remaining space */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
            height: 100%;
            width: 100%;
        }

        .sidebar {
            width: 340px;
            background: var(--panel);
            border-right: 1px solid #242936;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            z-index: 50;
            flex-shrink: 0;
        }

        /* Canvas Area - Full Space */
        .canvas-area {
            flex-grow: 1;
            position: relative;
            background: #333;
            overflow: hidden;
            cursor: default;
        }

        /* Cursores Contextuais */
        .canvas-area.mode-draw {
            cursor: crosshair;
        }

        .canvas-area.mode-pan {
            cursor: grab;
        }

        .canvas-area.mode-pan:active {
            cursor: grabbing;
        }

        .canvas-area.mode-move {
            cursor: move;
        }

        canvas {
            background: #e0e0e0;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            transform-origin: 0 0;
            outline: none;
            display: block;
        }

        .btn {
            background: #1b2130;
            border: 1px solid #242936;
            color: #fff;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 11px;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn:hover {
            border-color: var(--accent);
        }

        .btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: bold;
        }

        .btn-toggle.on {
            background: var(--ok);
            color: #000;
            border-color: var(--ok);
            font-weight: bold;
        }

        .btn-heat.on {
            background: var(--heat);
            color: white;
            border-color: var(--heat);
            font-weight: bold;
        }

        .btn-action {
            background: rgba(58, 163, 255, 0.15);
            border-color: var(--accent);
            color: var(--accent);
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-action:hover {
            background: var(--accent);
            color: #000;
        }

        .btn-del {
            background: rgba(231, 76, 60, 0.2);
            color: var(--bad);
            border: 1px solid var(--bad);
            padding: 2px 6px;
            margin-left: auto;
        }

        .separator {
            width: 1px;
            height: 20px;
            background: #444;
            margin: 0 4px;
        }

        .zone-card {
            background: #12161f;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            border-left: 3px solid var(--accent);
            font-size: 11px;
        }

        .zone-header {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        select,
        input {
            background: #1b2130;
            color: white;
            border: 1px solid #333;
            padding: 4px;
            border-radius: 2px;
        }

        input[type="number"] {
            width: 60px;
        }

        input[type="color"] {
            background: none;
            border: none;
            width: 25px;
            height: 25px;
            cursor: pointer;
            padding: 0;
        }

        #probeTooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid var(--accent);
            padding: 10px;
            border-radius: 4px;
            font-size: 11px;
            color: white;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            min-width: 200px;
        }

        .probe-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }

        .probe-table td {
            padding: 3px 5px;
            border-bottom: 1px solid #333;
        }

        .probe-total {
            font-weight: bold;
            color: var(--ok);
            border-top: 1px solid #555;
            background: rgba(46, 204, 113, 0.1);
        }

        /* Loading Overlay */
        #loader {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
        }
    </style>
</head>

<body>

    <div id="loader">
        <div style="font-size:20px; margin-bottom:10px">⏳</div>
        <div id="loaderMsg">A processar geometria...</div>
    </div>

    <div class="toolbar">
        <button class="btn" onclick="document.getElementById('fileIn').click()">📂 Imagem</button>
        <input type="file" id="fileIn" style="display:none" accept="image/*">
        <button class="btn" id="btnScale" onclick="setMode('scale')">📏 Escala</button>

        <div class="separator"></div>

        <button class="btn" id="btnDraw" onclick="setMode('draw')">✏️ Polígono</button>
        <button class="btn" id="btnRect" onclick="startRectangle()">⬜ Retângulo</button>
        <button class="btn" id="btnMove" onclick="setMode('move')">✥ Mover</button>
        <button class="btn" id="btnCopy" onclick="setMode('copy')">📋 Copiar</button>
        <button class="btn" id="btnEdit" onclick="setMode('edit')">🖱️ Editar Vértices</button>

        <div class="separator"></div>

        <button class="btn btn-toggle on" id="btnOrtho" onclick="toggleOrtho()">📐 Orto</button>
        <button class="btn btn-toggle on" id="btnSnap" onclick="toggleSnap()">🧲 Snap</button>

        <div class="separator"></div>

        <button class="btn" onclick="runAutoOrtho()" title="Corrigir linhas quase retas">✨ Auto-Ortho</button>
        <button class="btn" onclick="autoAlign()" title="Unir vértices muito próximos">🧲 Coesão</button>

        <div class="separator"></div>

        <button class="btn" id="btnProbe" onclick="setMode('probe')" style="border-color:var(--ok)">🖱️ Sonda</button>
        <button class="btn btn-heat" id="btnHeat" onclick="toggleHeatmap()">🔥 Mapa ELU</button>

        <span id="status" style="margin-left:auto; font-size:10px; color:#aaa; padding-right:10px;">Pronto</span>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div id="globalSlabConfig" style="background:#1a202c; padding:10px; border-radius:4px; margin-bottom:15px;">
                <label style="font-size:11px; color:#aaa;">Espessura Laje Global (m):</label>
                <input type="number" id="slabThick" value="0.20" step="0.01" style="width:100%"
                    onchange="clearHeatmap(); redraw();">
            </div>
            <div id="structLayerMsg"
                style="display:none; background:#1a202c; padding:10px; border-radius:4px; margin-bottom:15px; border:1px solid var(--accent); color:var(--accent); font-size:11px;">
                ⚠️ Espessura definida pelo desenho.
            </div>

            <h4 style="margin:0 0 10px 0; color:#ccc">Camadas</h4>

            <div style="display:flex; gap:5px; margin-bottom:10px;">
                <select id="layerSelect" onchange="switchLayer(this.value)" style="flex:1"></select>
                <button class="btn btn-del" onclick="deleteLayer()" title="Apagar toda a camada">🗑️</button>
            </div>

            <button class="btn btn-action" onclick="unifyZones()">⚡ Gerar Zonamento Unificado</button>
            <button class="btn" style="width:100%; margin-bottom:15px;" onclick="addLayer()">+ Nova Camada
                Vazia</button>

            <div style="flex:1; overflow-y:auto;" id="zonesList"></div>

            <div style="margin-top:auto; padding-top:10px; border-top:1px solid #333; text-align:center;">
                <label style="font-size:10px; margin-right:10px;"><input type="checkbox" id="showLeg" checked
                        onchange="redraw()"> Legendas</label>
                <button class="btn" onclick="exportJSON()">💾 JSON</button>
                <button class="btn" onclick="exportPrint()">🖨️ PNG</button>
                <button class="btn" onclick="sendToSSOT()" style="background:var(--ok);color:#000;font-weight:bold;">💾
                    Gravar e Fechar</button>
            </div>
        </div>

        <div class="canvas-area" id="canvasContainer">
            <canvas id="canvas" tabindex="0"></canvas>
            <div id="probeTooltip"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');
        const tooltip = document.getElementById('probeTooltip');
        let img = new Image();

        // --- STATE ---
        let activeLayer = 'Estrutura';
        let layers = { 'Estrutura': [], 'Sobrecargas': [], 'RCP': [] };
        let layerMeta = {
            'Estrutura': { type: 'struct' },
            'Sobrecargas': { type: 'sc' },
            'RCP': { type: 'other' }
        };

        // Estrutura de dados alterada: 'pts' agora é substituido por 'shapes' (array de arrays) no uso interno
        // mas para compatibilidade vamos manter nomes logicos.

        let mode = 'none';
        let points = [];
        let scale = 1;
        let orthoActive = true;
        let snapActive = true;
        let cadState = null;
        let selectedZoneIndex = -1;

        // Viewport & Pan
        let view = { scale: 1, x: 0, y: 0 };
        let isPanning = false;
        let lastMouse = { x: 0, y: 0 };
        let dragTarget = null;
        let mousePos = { x: 0, y: 0 };
        const SNAP_DIST = 15;

        // Dados Eurocódigo
        const EN1991 = {
            'A': { desc: 'Habitação', qk: 2.0 }, 'B': { desc: 'Escritórios', qk: 3.0 },
            'C1': { desc: 'Escolas/Rest.', qk: 3.0 }, 'C3': { desc: 'Congregação', qk: 5.0 },
            'D1': { desc: 'Comércio', qk: 4.0 }, 'E1': { desc: 'Armazém', qk: 7.5 },
            'F': { desc: 'Garagem (<30kN)', qk: 2.5 }, 'H': { desc: 'Cobertura', qk: 0.4 }
        };
        const colors = { 'A': '#2ecc71', 'B': '#3aa3ff', 'D1': '#f1c40f', 'C1': '#9b59b6', 'E1': '#e74c3c', 'F': '#95a5a6' };

        // --- Init & Events ---
        window.addEventListener('paste', e => handleImageUpload(e.clipboardData.items[0]?.getAsFile()));
        document.getElementById('fileIn').onchange = e => handleImageUpload(e.target.files[0]);
        // Ajuste para garantir que o canvas redimensiona corretamente
        window.addEventListener('resize', () => {
            if (img.src) { canvas.width = container.clientWidth; canvas.height = container.clientHeight; redraw(); }
        });

        function handleImageUpload(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                img.onload = () => {
                    canvas.width = container.clientWidth;
                    canvas.height = container.clientHeight;
                    resetView();
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        function resetView() {
            if (img.width) {
                const scW = canvas.width / img.width;
                const scH = canvas.height / img.height;
                view.scale = Math.min(scW, scH) * 0.9;
                view.x = (canvas.width - img.width * view.scale) / 2;
                view.y = (canvas.height - img.height * view.scale) / 2;
            }
            redraw();
        }

        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            const zoomIntensity = 0.1;
            const factor = 1 + (zoomIntensity * (e.deltaY < 0 ? 1 : -1));
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const wx = (mouseX - view.x) / view.scale;
            const wy = (mouseY - view.y) / view.scale;

            view.scale *= factor;
            view.x = mouseX - wx * view.scale;
            view.y = mouseY - wy * view.scale;
            redraw();
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (cadState || points.length > 0) {
                    points = []; cadState = null;
                    document.getElementById('status').innerText = "Ação cancelada.";
                    redraw();
                } else { setMode('none'); }
            }
        });

        // --- Modos e UI ---
        function setMode(m) {
            // REQUISITO 5: Bloquear desenho sem escala
            if ((m === 'draw' || m === 'rect') && scale === 1) {
                alert("⚠️ Defina primeiro a escala!");
                return;
            }

            if (mode === m && m !== 'rect') m = 'none';
            mode = m; points = []; dragTarget = null; cadState = null; selectedZoneIndex = -1;
            tooltip.style.display = 'none';

            if (m !== 'none' && m !== 'probe') { showHeatmap = false; document.getElementById('btnHeat').classList.remove('on'); }

            container.className = 'canvas-area';
            if (m === 'draw') container.classList.add('mode-draw');
            if (m === 'move') container.classList.add('mode-move');
            if (m === 'none') container.classList.add('mode-pan');

            updateUI(); redraw();
        }

        function updateUI() {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            if (mode !== 'none' && mode !== 'rect') document.getElementById('btn' + mode.charAt(0).toUpperCase() + mode.slice(1))?.classList.add('active');

            let status = "Navegação";
            if (mode === 'draw') status = "Desenho: Clique para adicionar. Aproxime do início para fechar.";
            if (mode === 'rect') status = "Retângulo: Clique para posicionar.";
            if (mode === 'scale') status = "Escala: Clique no Ponto A e depois no Ponto B (Linha Orto).";
            if (mode === 'move') status = "Mover: Selecione Zona -> Ponto Base -> Destino.";
            if (mode === 'probe') status = "Sonda: Passe o rato para ver cargas acumuladas.";
            if (showHeatmap) status = "VISUALIZAÇÃO: Mapa ELU Ativo.";

            document.getElementById('status').innerText = status;
            const hasStruct = Object.values(layerMeta).some(m => m.type === 'struct');
            document.getElementById('globalSlabConfig').style.display = hasStruct ? 'none' : 'block';
            document.getElementById('structLayerMsg').style.display = hasStruct ? 'block' : 'none';
        }

        function toggleOrtho() { orthoActive = !orthoActive; document.getElementById('btnOrtho').classList.toggle('on', orthoActive); }
        function toggleSnap() { snapActive = !snapActive; document.getElementById('btnSnap').classList.toggle('on', snapActive); }

        // --- FERRAMENTAS AVANÇADAS ---
        function runAutoOrtho() {
            if (!layers[activeLayer]) return;
            let c = 0;
            layers[activeLayer].forEach(z => {
                z.shapes.forEach(pts => {
                    for (let i = 0; i < pts.length; i++) {
                        let p1 = pts[i], p2 = pts[(i + 1) % pts.length];
                        let dx = Math.abs(p2.x - p1.x), dy = Math.abs(p2.y - p1.y);
                        let a = Math.atan2(dy, dx) * 180 / Math.PI;
                        if (a < 15) { p2.y = p1.y; c++; }
                        else if (a > 75) { p2.x = p1.x; c++; }
                    }
                });
            });
            clearHeatmap(); redraw();
            alert(`Auto-Ortho: ${c} vértices ajustados.`);
        }

        function autoAlign() {
            if (!layers[activeLayer]) return;
            let all = [];
            layers[activeLayer].forEach(z => z.shapes.forEach(pts => pts.forEach(p => all.push(p))));
            let c = 0;
            const limit = SNAP_DIST / view.scale;
            for (let i = 0; i < all.length; i++) {
                for (let j = i + 1; j < all.length; j++) {
                    let p1 = all[i], p2 = all[j];
                    if (Math.hypot(p1.x - p2.x, p1.y - p2.y) < limit) {
                        let ax = (p1.x + p2.x) / 2, ay = (p1.y + p2.y) / 2;
                        p1.x = p2.x = ax; p1.y = p2.y = ay;
                        c++;
                    }
                }
            }
            clearHeatmap(); redraw();
            alert(`Coesão: ${c} pontos unificados.`);
        }

        // --- CAD TOOLS ---
        function startRectangle() {
            if (scale === 1) { alert("Defina a Escala primeiro!"); return; } // Dupla verificação
            const input = prompt("Largura, Altura (m). Ex: '5, 3'");
            if (!input) return;
            const parts = input.replace(/,/g, ' ').replace(/x/i, ' ').split(' ').filter(p => p);
            if (parts.length < 2) return;
            const w = parseFloat(parts[0]), h = parseFloat(parts[1]);
            const wPx = w * scale, hPx = h * scale;
            cadState = { type: 'rect', ghost: [{ x: -wPx / 2, y: -hPx / 2 }, { x: wPx / 2, y: -hPx / 2 }, { x: wPx / 2, y: hPx / 2 }, { x: -wPx / 2, y: hPx / 2 }] };
            mode = 'rect'; updateMouseWorld(lastMouse.x, lastMouse.y); updateUI(); redraw();
        }

        function handleCadClick(worldPos) {
            if (mode === 'rect' && cadState?.type === 'rect') {
                const finalPts = cadState.ghost.map(p => ({ x: p.x + worldPos.x, y: p.y + worldPos.y }));
                addZone(finalPts); setMode('none'); return;
            }
            if (mode === 'move' || mode === 'copy') {
                if (!cadState) {
                    const hit = findZoneAt(worldPos);
                    if (hit.idx !== -1) {
                        selectedZoneIndex = hit.idx;
                        cadState = {
                            type: mode, phase: 'pickBase',
                            zoneIdx: hit.idx,
                            shapeIdx: hit.shapeIdx,
                            originalPts: JSON.parse(JSON.stringify(layers[activeLayer][hit.idx].shapes[hit.shapeIdx]))
                        };
                        document.getElementById('status').innerText = "Selecione o PONTO BASE."; redraw();
                    }
                    return;
                }
                if (cadState.phase === 'pickBase') {
                    cadState.basePoint = { ...worldPos }; cadState.phase = 'dragging';
                    document.getElementById('status').innerText = "Arraste para o destino."; return;
                }
                if (cadState.phase === 'dragging') {
                    const dx = worldPos.x - cadState.basePoint.x, dy = worldPos.y - cadState.basePoint.y;
                    const newPts = cadState.originalPts.map(p => ({ x: p.x + dx, y: p.y + dy }));

                    if (mode === 'move') {
                        // Mover altera a forma existente
                        layers[activeLayer][cadState.zoneIdx].shapes[cadState.shapeIdx] = newPts;
                    } else {
                        // REQUISITO 2: Copiar adiciona à mesma zona (instância)
                        layers[activeLayer][cadState.zoneIdx].shapes.push(newPts);
                    }

                    updateZoneList(); // Atualizar areas
                    clearHeatmap();
                    setMode('none');
                }
            }
        }

        // --- MOUSE ENGINE ---
        function toWorld(sx, sy) {
            const r = canvas.getBoundingClientRect();
            return { x: (sx - r.left - view.x) / view.scale, y: (sy - r.top - view.y) / view.scale };
        }

        function updateMouseWorld(cx, cy) {
            const raw = toWorld(cx, cy);
            let pos = { ...raw };

            // REQUISITO 3: Snap ao Contorno da Estrutura (Limite)
            // Assume que a primeira zona da camada 'Estrutura' é o limite do piso
            const structLayer = layers['Estrutura'];
            if (structLayer && structLayer.length > 0 && structLayer[0].shapes.length > 0) {
                const boundPoly = structLayer[0].shapes[0]; // Limite principal
                if (!isPointInPoly(pos, boundPoly)) {
                    pos = getClosestPointOnPoly(pos, boundPoly);
                }
            }

            if (snapActive && mode !== 'none') { let s = findGlobalSnap(pos); if (s) pos = s; }

            if (mode === 'draw' && points.length > 2) {
                if (Math.hypot(pos.x - points[0].x, pos.y - points[0].y) < SNAP_DIST / view.scale) pos = points[0];
            }

            if (mode === 'draw' && points.length > 0 && orthoActive && pos !== points[0]) {
                let l = points[points.length - 1];
                if (Math.abs(raw.x - l.x) < Math.abs(raw.y - l.y)) pos.x = l.x; else pos.y = l.y;
            }

            // REQUISITO 4: Escala Ortogonal sempre
            if (mode === 'scale' && points.length === 1) {
                let l = points[0];
                if (Math.abs(raw.x - l.x) < Math.abs(raw.y - l.y)) pos.x = l.x; else pos.y = l.y;
            }

            mousePos = pos; return raw;
        }

        canvas.onmousedown = e => {
            e.preventDefault(); canvas.focus();
            lastMouse = { x: e.clientX, y: e.clientY };
            if (e.button === 1 || mode === 'none' || mode === 'probe') { isPanning = true; container.style.cursor = 'grabbing'; return; }
            updateMouseWorld(e.clientX, e.clientY);
            if (mode === 'edit') checkEditHit(mousePos);
        };

        window.addEventListener('mouseup', () => { isPanning = false; dragTarget = null; if (mode === 'none') container.style.cursor = 'grab'; redraw(); });

        canvas.onmousemove = e => {
            if (isPanning) {
                view.x += e.clientX - lastMouse.x;
                view.y += e.clientY - lastMouse.y;
                lastMouse = { x: e.clientX, y: e.clientY };
                redraw(); return;
            }
            lastMouse = { x: e.clientX, y: e.clientY };
            updateMouseWorld(e.clientX, e.clientY);

            if (mode === 'probe') { updateProbe(mousePos, e.clientX, e.clientY); return; }
            if (mode === 'edit' && dragTarget) handleDrag(mousePos);
            redraw();
        };

        canvas.onclick = e => {
            if (isPanning || dragTarget || mode === 'probe') return;
            if (mode === 'rect' || mode === 'move' || mode === 'copy') { handleCadClick(mousePos); return; }

            let p = mousePos;
            if (mode === 'scale') {
                points.push(p);
                if (points.length === 2) {
                    const val = prompt("Distância real (m):", "1.0");
                    if (val) { scale = Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y) / parseFloat(val.replace(',', '.')); }
                    setMode('none');
                }
            } else if (mode === 'draw') {
                if (points.length > 2 && p === points[0]) { addZone(points); points = []; }
                else { points.push(p); }
            }
            redraw();
        };

        // --- CORE ---
        function addZone(ptsArray) {
            const isSC = layerMeta[activeLayer].type === 'sc';
            const isStruct = layerMeta[activeLayer].type === 'struct';
            const newId = getNextID(activeLayer);
            let defVal = 1.0, defDesc = "Carga", defColor = '#e67e22';
            if (isSC) { defVal = 0; defDesc = ""; defColor = '#3aa3ff'; }
            if (isStruct) { defVal = 0.20; defDesc = "Laje"; defColor = '#95a5a6'; }

            // NOVA ESTRUTURA: shapes: [ [p1,p2...], [p3,p4...] ]
            layers[activeLayer].push({
                id: newId,
                shapes: [[...ptsArray]],
                uso: isSC ? 'B' : 'Manual',
                manualLoad: defVal,
                manualDesc: defDesc,
                color: defColor,
                labelOffset: { x: 0, y: 0 }
            });
            updateZoneList(); clearHeatmap();
        }

        function findZoneAt(p) {
            if (!layers[activeLayer]) return { idx: -1 };
            for (let i = layers[activeLayer].length - 1; i >= 0; i--) {
                const z = layers[activeLayer][i];
                for (let j = 0; j < z.shapes.length; j++) {
                    if (isPointInPoly(p, z.shapes[j])) return { idx: i, shapeIdx: j };
                }
            }
            return { idx: -1 };
        }

        // --- UNIFICAÇÃO (Atualizado para multi-shape) ---
        function unifyZones() {
            if (!scale || scale === 1) { alert("Defina a escala antes de unificar."); return; }
            document.getElementById('loader').style.display = 'flex';
            setTimeout(() => {
                const uLayer = "UNIFICADO " + new Date().toLocaleTimeString();
                layers[uLayer] = []; layerMeta[uLayer] = { type: 'other' };
                const cellSize = scale * 0.20;
                const cols = Math.ceil(canvas.width / cellSize);
                const rows = Math.ceil(canvas.height / cellSize);
                let gridVal = new Array(cols * rows).fill(null);

                for (let y = 0; y < rows; y++) {
                    for (let x = 0; x < cols; x++) {
                        const cx = x * cellSize + cellSize / 2;
                        const cy = y * cellSize + cellSize / 2;
                        const p = { x: cx, y: cy };
                        let loadSum = 0; let hasLoad = false;
                        for (let l in layers) {
                            const type = layerMeta[l].type;
                            if (type === 'struct' || l.startsWith('UNIFICADO')) continue;
                            layers[l].forEach(z => {
                                z.shapes.forEach(sh => {
                                    if (isPointInPoly(p, sh)) {
                                        hasLoad = true;
                                        if (type === 'sc') loadSum += (EN1991[z.uso]?.qk || 0);
                                        else loadSum += (parseFloat(z.manualLoad) || 0);
                                    }
                                });
                            });
                        }
                        if (hasLoad) gridVal[y * cols + x] = loadSum.toFixed(2);
                    }
                }
                // ... (Algoritmo Greedy Meshing mantém-se similar, apenas criação final ajustada)
                // Simplificado para brevidade: reutiliza logica v4.8 mas adaptada
                let visited = new Uint8Array(cols * rows);
                let zoneCount = 1;
                for (let y = 0; y < rows; y++) {
                    for (let x = 0; x < cols; x++) {
                        const idx = y * cols + x;
                        if (visited[idx] || gridVal[idx] === null) continue;
                        const currentVal = gridVal[idx];
                        let w = 1;
                        while (x + w < cols && !visited[y * cols + (x + w)] && gridVal[y * cols + (x + w)] === currentVal) w++;
                        let h = 1;
                        while (y + h < rows) {
                            let rowMatch = true;
                            for (let k = 0; k < w; k++) {
                                if (visited[(y + h) * cols + (x + k)] || gridVal[(y + h) * cols + (x + k)] !== currentVal) { rowMatch = false; break; }
                            }
                            if (!rowMatch) break;
                            h++;
                        }
                        for (let ly = 0; ly < h; ly++) for (let lx = 0; lx < w; lx++) visited[(y + ly) * cols + (x + lx)] = 1;
                        const x1 = x * cellSize, y1 = y * cellSize, x2 = x1 + w * cellSize, y2 = y1 + h * cellSize;
                        layers[uLayer].push({
                            id: zoneCount++,
                            shapes: [[{ x: x1, y: y1 }, { x: x2, y: y1 }, { x: x2, y: y2 }, { x: x1, y: y2 }]],
                            uso: 'Manual', manualLoad: parseFloat(currentVal), manualDesc: `Carga Comb.`,
                            color: generateColor(parseFloat(currentVal)), labelOffset: { x: 0, y: 0 }
                        });
                    }
                }
                activeLayer = uLayer; updateLayerSel(); updateZoneList(); redraw();
                document.getElementById('loader').style.display = 'none';
                alert(`Gerado: ${uLayer}\n${layers[uLayer].length} zonas únicas.`);
            }, 100);
        }
        function generateColor(val) { const max = 10; const r = Math.min(255, (val / max) * 255); const g = Math.min(255, 255 - (val / max) * 255); return `rgb(${r},${g},50)`; }

        // --- RENDERING ---
        function redraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save(); ctx.translate(view.x, view.y); ctx.scale(view.scale, view.scale);

            if (img.src) {
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0);
            }

            // REQUISITO 4: Linha de Escala Visual
            if (mode === 'scale' && points.length === 1) {
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                ctx.lineTo(mousePos.x, mousePos.y);
                ctx.strokeStyle = "#e74c3c";
                ctx.lineWidth = 2 / view.scale;
                ctx.setLineDash([5 / view.scale, 5 / view.scale]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            if (showHeatmap && heatmapGrid) {
                const range = heatmapStats.max - heatmapStats.min;
                heatmapGrid.forEach(cell => {
                    const ratio = range === 0 ? 1 : (cell.val - heatmapStats.min) / range;
                    ctx.fillStyle = `rgba(255, 0, 0, ${0.1 + (0.7 * ratio)})`;
                    ctx.fillRect(cell.x, cell.y, 20, 20);
                });

                ctx.restore(); ctx.save();
                if (heatmapStats.max > 0) {
                    const lx = 20, ly = canvas.height - 100;
                    ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(lx, ly, 160, 80);
                    ctx.strokeStyle = "white"; ctx.strokeRect(lx, ly, 160, 80);
                    ctx.fillStyle = "white"; ctx.font = "bold 12px Inter"; ctx.fillText("Mapa de Calor ELU (Psd)", lx + 10, ly + 20);
                    const grad = ctx.createLinearGradient(lx + 10, ly + 40, lx + 110, ly + 40);
                    grad.addColorStop(0, "rgba(255,0,0,0.1)"); grad.addColorStop(1, "rgba(255,0,0,0.8)");
                    ctx.fillStyle = grad; ctx.fillRect(lx + 10, ly + 35, 100, 15);
                    ctx.fillStyle = "white"; ctx.font = "10px Inter";
                    ctx.fillText(heatmapStats.min.toFixed(1) + " kN/m²", lx + 10, ly + 65);
                    ctx.fillText(heatmapStats.max.toFixed(1) + " kN/m²", lx + 110, ly + 65);
                }
                ctx.restore(); ctx.save(); ctx.translate(view.x, view.y); ctx.scale(view.scale, view.scale);
            }

            if (!showHeatmap) {
                const lw = 2 / view.scale;
                layers[activeLayer].forEach((z, idx) => {
                    if (mode === 'move' && idx === selectedZoneIndex && cadState?.phase === 'dragging') ctx.globalAlpha = 0.3;
                    else ctx.globalAlpha = 1;

                    // Render Multi-Shapes
                    z.shapes.forEach(pts => {
                        ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); pts.forEach(p => ctx.lineTo(p.x, p.y)); ctx.closePath();
                        let color = layerMeta[activeLayer].type === 'sc' ? colors[z.uso] : (z.color || '#e67e22');
                        if (idx === selectedZoneIndex) { ctx.shadowColor = "white"; ctx.shadowBlur = 10; }
                        ctx.fillStyle = color + '55'; ctx.fill(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.stroke(); ctx.shadowBlur = 0;
                    });

                    if (document.getElementById('showLeg').checked && ctx.globalAlpha > 0.5) {
                        // Legenda usa o centro do primeiro shape por simplificacao, ou media
                        const c = getCentroid(z.shapes[0]);
                        const lx = c.x + (z.labelOffset?.x || 0), ly = c.y + (z.labelOffset?.y || 0);
                        const valTxt = layerMeta[activeLayer].type === 'sc' ? (EN1991[z.uso]?.qk + 'kN') : (parseFloat(z.manualLoad).toFixed(2) + 'kN');
                        const txt = `Z${z.id} [${valTxt}]`;
                        ctx.font = `bold ${11 / view.scale}px Inter`;
                        const tm = ctx.measureText(txt);
                        ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.fillRect(lx - tm.width / 2 - 2, ly - 10 / view.scale, tm.width + 4, 14 / view.scale);
                        ctx.fillStyle = "black"; ctx.textAlign = "center"; ctx.fillText(txt, lx, ly);
                    }
                });
            }
            ctx.globalAlpha = 1;

            if (cadState) {
                let ghostPts = [];
                if (cadState.type === 'rect') ghostPts = cadState.ghost.map(p => ({ x: p.x + mousePos.x, y: p.y + mousePos.y }));
                else if ((mode === 'move' || mode === 'copy') && cadState.phase === 'dragging') {
                    const dx = mousePos.x - cadState.basePoint.x, dy = mousePos.y - cadState.basePoint.y;
                    ghostPts = cadState.originalPts.map(p => ({ x: p.x + dx, y: p.y + dy }));
                }
                if (ghostPts.length > 0) {
                    ctx.beginPath(); ctx.moveTo(ghostPts[0].x, ghostPts[0].y); ghostPts.forEach(p => ctx.lineTo(p.x, p.y)); ctx.closePath();
                    ctx.strokeStyle = "white"; ctx.lineWidth = 2 / view.scale; ctx.setLineDash([5 / view.scale, 5 / view.scale]); ctx.stroke(); ctx.setLineDash([]);
                }
            }

            if (mode === 'draw' && points.length > 0) {
                ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y); points.forEach(p => ctx.lineTo(p.x, p.y)); ctx.lineTo(mousePos.x, mousePos.y);
                ctx.strokeStyle = 'cyan'; ctx.lineWidth = 2 / view.scale; ctx.stroke();
                ctx.fillStyle = 'cyan'; points.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 3 / view.scale, 0, Math.PI * 2); ctx.fill(); });
            }

            const isSnapping = snapActive && (findGlobalSnap(mousePos) || (mode === 'draw' && points.length > 2 && mousePos === points[0]));
            if (isSnapping || (cadState && cadState.phase === 'pickBase')) {
                ctx.beginPath(); ctx.arc(mousePos.x, mousePos.y, 5 / view.scale, 0, Math.PI * 2); ctx.fillStyle = "#ff00ff"; ctx.fill(); ctx.strokeStyle = "white"; ctx.stroke();
            }
            if (mode === 'edit') {
                ctx.fillStyle = "white"; ctx.strokeStyle = "black"; ctx.lineWidth = 1 / view.scale;
                layers[activeLayer].forEach(z => {
                    z.shapes.forEach(pts => {
                        pts.forEach(p => { ctx.beginPath(); ctx.rect(p.x - 4 / view.scale, p.y - 4 / view.scale, 8 / view.scale, 8 / view.scale); ctx.fill(); ctx.stroke() });
                    });
                });
            }
            ctx.restore();
        }

        // --- Utils & Helpers ---
        function getNextID(l) { const z = layers[l]; return (!z || z.length === 0) ? 1 : Math.max(...z.map(i => i.id)) + 1; }
        function getCentroid(pts) { let x = 0, y = 0; pts.forEach(p => { x += p.x; y += p.y }); return { x: x / pts.length, y: y / pts.length } }
        function distToSegment(p, v, w) { let l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2; if (l2 == 0) return Math.hypot(p.x - v.x, p.y - v.y); let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2; t = Math.max(0, Math.min(1, t)); return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y))) }
        function findGlobalSnap(p) { const l = SNAP_DIST / view.scale; for (let z of layers[activeLayer]) { for (let sh of z.shapes) { for (let pt of sh) if (Math.hypot(p.x - pt.x, p.y - pt.y) < l) return pt } } return null }
        function isPointInPoly(p, poly) { let inside = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y; if (((yi > p.y) !== (yj > p.y)) && (p.x < (xj - xi) * (p.y - yi) / (yj - yi) + xi)) inside = !inside; } return inside; }

        function getClosestPointOnPoly(p, poly) {
            let minDist = Infinity;
            let closest = { x: p.x, y: p.y };
            for (let i = 0; i < poly.length; i++) {
                const p1 = poly[i];
                const p2 = poly[(i + 1) % poly.length];
                const l2 = (p1.x - p2.x) ** 2 + (p1.y - p2.y) ** 2;
                let t = ((p.x - p1.x) * (p2.x - p1.x) + (p.y - p1.y) * (p2.y - p1.y)) / l2;
                t = Math.max(0, Math.min(1, t));
                const proj = { x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y) };
                const d = (p.x - proj.x) ** 2 + (p.y - proj.y) ** 2;
                if (d < minDist) { minDist = d; closest = proj; }
            }
            return closest;
        }

        function checkEditHit(m) {
            const hit = 10 / view.scale; const showLeg = document.getElementById('showLeg').checked;
            if (showLeg) { for (let z of layers[activeLayer]) { const c = getCentroid(z.shapes[0]); if (Math.abs(m.x - (c.x + (z.labelOffset?.x || 0))) < 50 / view.scale && Math.abs(m.y - (c.y + (z.labelOffset?.y || 0))) < 15 / view.scale) { dragTarget = { type: 'label', zone: z, startM: m, startOff: { ...(z.labelOffset || { x: 0, y: 0 }) } }; return; } } }

            for (let z of layers[activeLayer]) {
                for (let j = 0; j < z.shapes.length; j++) {
                    let pts = z.shapes[j];
                    for (let i = 0; i < pts.length; i++) { if (Math.hypot(m.x - pts[i].x, m.y - pts[i].y) < hit) { dragTarget = { type: 'pt', zone: z, shapeIdx: j, index: i }; return; } }
                    for (let i = 0; i < pts.length; i++) { let p1 = pts[i], p2 = pts[(i + 1) % pts.length]; if (distToSegment(m, p1, p2) < hit) { dragTarget = { type: 'line', zone: z, shapeIdx: j, index: i, startM: m, p1Start: { ...p1 }, p2Start: { ...p2 } }; return; } }
                }
            }
        }
        function handleDrag(m) {
            if (!dragTarget) return; clearHeatmap();
            if (dragTarget.type === 'label') { dragTarget.zone.labelOffset = { x: dragTarget.startOff.x + (m.x - dragTarget.startM.x), y: dragTarget.startOff.y + (m.y - dragTarget.startM.y) }; }
            else if (dragTarget.type === 'pt') { dragTarget.zone.shapes[dragTarget.shapeIdx][dragTarget.index] = m; }
            else if (dragTarget.type === 'line') { const dx = m.x - dragTarget.startM.x, dy = m.y - dragTarget.startM.y; let pts = dragTarget.zone.shapes[dragTarget.shapeIdx], p1 = pts[dragTarget.index], p2 = pts[(dragTarget.index + 1) % pts.length]; p1.x = dragTarget.p1Start.x + dx; p1.y = dragTarget.p1Start.y + dy; p2.x = dragTarget.p2Start.x + dx; p2.y = dragTarget.p2Start.y + dy; }
            updateZoneList();
        }

        // --- Management ---
        function updateZoneList() {
            const list = document.getElementById('zonesList');
            const type = layerMeta[activeLayer].type;
            list.innerHTML = layers[activeLayer].map((z, i) => {
                let area = 0;
                if (scale) {
                    z.shapes.forEach(pts => {
                        let a = 0;
                        pts.forEach((pt, j) => { let k = (j + 1) % pts.length; a += pt.x * pts[k].y - pts[k].x * pt.y });
                        area += Math.abs(a) / 2;
                    });
                    area = area / (scale * scale);
                }
                let inputs = type === 'sc' ?
                    `<select onchange="updateZoneProp(${i}, 'uso', this.value)">${Object.entries(EN1991).map(([k, v]) => `<option value="${k}" ${z.uso === k ? 'selected' : ''}>${k} - ${v.desc} (${v.qk}kN)</option>`).join('')}</select>` :
                    `<div style="display:flex; gap:5px; align-items:center;">
                <input type="color" value="${z.color || '#e67e22'}" onchange="updateZoneProp(${i}, 'color', this.value)" ${activeLayer.includes('UNIFICADO') ? 'disabled' : ''}>
                ${type === 'struct' ?
                        `<span style="font-size:11px;color:#aaa">h(m):</span><input type="number" value="${z.manualLoad || 0.20}" step="0.01" onchange="updateZoneProp(${i},'manualLoad',this.value)" style="flex:1">` :
                        `<input type="text" value="${z.manualDesc || ''}" onchange="updateZoneProp(${i},'manualDesc',this.value)" style="flex:1; width:50px"><input type="number" value="${z.manualLoad || 0}" onchange="updateZoneProp(${i},'manualLoad',this.value)" style="width:40px" ${activeLayer.includes('UNIFICADO') ? 'readonly' : ''}>`}
            </div>`;
                return `<div class="zone-card" style="border-color:${type === 'sc' ? colors[z.uso] : (z.color || '#e67e22')}"><div class="zone-header" onclick="highlightZone(${i})" style="cursor:pointer"><strong>#${z.id}</strong> <span style="margin-left:5px; color:#aaa">${area.toFixed(2)} m²</span><button class="btn-del" onclick="deleteZone(${i})">🗑️</button></div>${inputs}</div>`;
            }).join('');
        }
        function highlightZone(i) { selectedZoneIndex = i; redraw(); setTimeout(() => { selectedZoneIndex = -1; redraw(); }, 500); }
        function updateZoneProp(idx, prop, val) { layers[activeLayer][idx][prop] = val; clearHeatmap(); redraw(); }
        function deleteZone(idx) { if (confirm("Apagar zona?")) { layers[activeLayer].splice(idx, 1); clearHeatmap(); updateZoneList(); redraw(); } }

        function addLayer() { const n = prompt("Nome da Nova Camada:"); if (!n) return; let type = 'other'; if (confirm("É uma Camada de Sobrecarga (SC)?")) type = 'sc'; else if (confirm("É uma Camada de Estrutura (Laje)?")) type = 'struct'; layers[n] = []; layerMeta[n] = { type }; activeLayer = n; updateLayerSel(); redraw(); }
        function deleteLayer() {
            if (confirm(`Tem a certeza que quer apagar TODA a camada "${activeLayer}"?`)) {
                delete layers[activeLayer]; delete layerMeta[activeLayer];
                const keys = Object.keys(layers);
                if (keys.length === 0) { layers['Default'] = []; layerMeta['Default'] = { type: 'other' }; activeLayer = 'Default'; }
                else { activeLayer = keys[0]; }
                updateLayerSel(); updateZoneList(); redraw();
            }
        }
        function updateLayerSel() { document.getElementById('layerSelect').innerHTML = Object.keys(layers).map(k => `<option value="${k}" ${k === activeLayer ? 'selected' : ''}>${k}</option>`).join(''); }
        function switchLayer(v) { activeLayer = v; updateZoneList(); redraw(); }

        // --- Probe/Heatmap ---
        let showHeatmap = false; let heatmapGrid = null; let heatmapStats = { min: 0, max: 0 };

        function updateProbe(pos, cx, cy) {
            const globalThick = parseFloat(document.getElementById('slabThick').value) || 0;
            const hasStruct = Object.values(layerMeta).some(m => m.type === 'struct');
            let pointThick = hasStruct ? 0 : globalThick;
            let g_total = 0, q_total = 0;
            let html = `<strong>Sonda P(${pos.x.toFixed(0)},${pos.y.toFixed(0)})</strong><br><table class="probe-table">`;

            if (hasStruct) {
                for (let l in layers) {
                    if (l.includes('UNIFICADO')) continue;
                    if (layerMeta[l].type === 'struct') {
                        layers[l].forEach(z => {
                            z.shapes.forEach(sh => {
                                if (isPointInPoly(pos, sh)) pointThick = Math.max(pointThick, parseFloat(z.manualLoad) || 0);
                            });
                        });
                    }
                }
            }
            html += `<tr><td>PP Laje (${pointThick.toFixed(2)}m)</td><td>${(pointThick * 25).toFixed(2)}</td></tr>`;

            for (let l in layers) {
                if (layerMeta[l].type === 'struct' || l.includes('UNIFICADO')) continue;
                layers[l].forEach(z => {
                    z.shapes.forEach(sh => {
                        if (isPointInPoly(pos, sh)) {
                            const t = layerMeta[l].type;
                            let val = 0;
                            if (t === 'sc') { val = (EN1991[z.uso]?.qk || 0); q_total += val; html += `<tr><td>SC (${z.uso})</td><td>${val.toFixed(2)}</td></tr>`; }
                            else { val = (parseFloat(z.manualLoad) || 0); g_total += val; html += `<tr><td>${z.manualDesc || l}</td><td>${val.toFixed(2)}</td></tr>`; }
                        }
                    });
                });
            }
            const psd = 1.35 * (pointThick * 25 + g_total) + 1.5 * q_total;
            html += `<tr class="probe-total"><td>ELU (Psd)</td><td>${psd.toFixed(2)} kN/m²</td></tr></table>`;
            tooltip.innerHTML = html; tooltip.style.display = 'block';
            // Fix tool tip edge
            const r = container.getBoundingClientRect();
            let tx = cx, ty = cy;
            if (cx > r.width - 200) tx -= 210; else tx += 15;
            tooltip.style.left = tx + 'px'; tooltip.style.top = (ty + 15) + 'px';
        }

        function toggleHeatmap() {
            showHeatmap = !showHeatmap;
            document.getElementById('btnHeat').classList.toggle('on', showHeatmap);
            if (showHeatmap) calculateHeatmap();
            redraw(); updateUI();
        }
        function clearHeatmap() { heatmapGrid = null; if (showHeatmap) calculateHeatmap(); }

        function calculateHeatmap() {
            if (!img.src) return;
            const gs = 20; const cols = Math.ceil(canvas.width / gs), rows = Math.ceil(canvas.height / gs); const grid = [];
            const globalThick = parseFloat(document.getElementById('slabThick').value) || 0;
            const hasStruct = Object.values(layerMeta).some(m => m.type === 'struct');
            let min = Infinity, max = -Infinity;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const cx = x * gs + gs / 2, cy = y * gs + gs / 2, p = { x: cx, y: cy };
                    let pt = hasStruct ? 0 : globalThick, g = 0, q = 0;
                    for (let l in layers) {
                        if (l.includes('UNIFICADO')) continue;
                        layers[l].forEach(z => {
                            z.shapes.forEach(sh => {
                                if (isPointInPoly(p, sh)) {
                                    if (layerMeta[l].type === 'struct') pt = Math.max(pt, parseFloat(z.manualLoad) || 0);
                                    else if (layerMeta[l].type === 'sc') q += EN1991[z.uso]?.qk || 0;
                                    else g += parseFloat(z.manualLoad) || 0;
                                }
                            });
                        });
                    }
                    const psd = 1.35 * (pt * 25 + g) + 1.5 * q;
                    if (psd > 1) { if (psd > max) max = psd; if (psd < min) min = psd; grid.push({ x: x * gs, y: y * gs, val: psd }); }
                }
            }
            heatmapGrid = grid; heatmapStats = { min, max };
        }

        function exportJSON() {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify({ layers, layerMeta, scale, version: "4.9" }, null, 2)], { type: "application/json" }));
            a.download = "projeto_zonamento_v4.9.json"; a.click();
        }
        function exportPrint() {
            const t = document.createElement('canvas'); t.width = canvas.width; t.height = canvas.height;
            const c = t.getContext('2d');
            const oldView = { ...view }; view = { x: 0, y: 0, scale: 1 };
            redraw(); c.drawImage(canvas, 0, 0);
            view = oldView; redraw();
            const a = document.createElement('a'); a.href = t.toDataURL(); a.download = "planta_cargas.png"; a.click();
        }

        // v8: Send data to SSOT via postMessage
        function sendToSSOT() {
            if (!img.src) {
                alert('⚠️ Carregue uma imagem primeiro!');
                return;
            }

            const data = {
                blueprint: {
                    image: img.src,
                    scale: scale
                },
                layers: layers
            };

            const pisoId = new URLSearchParams(location.search).get('piso');

            if (window.opener && pisoId) {
                window.opener.postMessage({
                    type: 'zonesData',
                    pisoId: pisoId,
                    data: data
                }, '*');
                window.close();
            } else {
                alert('⚠️ Esta janela deve ser aberta pelo Template JSJ');
            }
        }

        // ✅ v10.2 FIX: Listen for initEditor postMessage from Index.html
        window.addEventListener('message', (event) => {
            if (event.data.type === 'initEditor') {
                const floorId = event.data.floorId;
                const actionsData = event.data.data;
                
                console.log('[zonas.html v10.2] Received initEditor:', {
                    floorId: floorId,
                    hasData: !!actionsData,
                    layersCount: Object.keys(actionsData?.layers || {}).length
                });

                if (!actionsData || !actionsData.layers || Object.keys(actionsData.layers).length === 0) {
                    console.log('[zonas.html v10.2] No data to load, starting fresh');
                    return;
                }

                // Load blueprint
                if (actionsData.blueprint && actionsData.blueprint.image) {
                    scale = actionsData.blueprint.scale || 1;
                    img.onload = () => {
                        canvas.width = container.clientWidth;
                        canvas.height = container.clientHeight;
                        resetView();
                        redraw();
                    };
                    img.src = actionsData.blueprint.image;
                }

                // Load layers
                if (actionsData.layers) {
                    layers = actionsData.layers;
                    // Rebuild layerMeta from loaded data
                    layerMeta = {};
                    for (let layerName in layers) {
                        // Infer type from layer content
                        if (layerName === 'Estrutura' || layerName.includes('Espessuras')) {
                            layerMeta[layerName] = { type: 'struct' };
                        } else if (layerName === 'Sobrecargas' || layerName.includes('Sobrecarga')) {
                            layerMeta[layerName] = { type: 'sc' };
                        } else if (layerName === 'RCP' || layerName.includes('RP')) {
                            layerMeta[layerName] = { type: 'other' };
                        } else {
                            layerMeta[layerName] = { type: 'other' };
                        }
                    }
                    updateLayerSel();
                    updateZoneList();
                    redraw();
                    console.log('[zonas.html v10.2] Data loaded successfully!');
                }
            }
        });

        // ✅ v10.2 FIX: Notify parent window when ready
        window.addEventListener('load', () => {
            const pisoId = new URLSearchParams(location.search).get('piso');
            if (window.opener && pisoId) {
                console.log('[zonas.html v10.2] Editor ready, requesting data for floor:', pisoId);
                window.opener.postMessage({
                    type: 'editorReady',
                    floorId: pisoId
                }, '*');
            }
        });

        // v8: Load existing data from parent window (Fallback for older versions)
        setTimeout(() => {
            const pisoId = new URLSearchParams(location.search).get('piso');
            let actionsData = null;

            // Step 1: Try to get data from window.opener (Legacy/Standard)
            if (pisoId && window.opener && window.opener.findPisoById) {
                try {
                    const piso = window.opener.findPisoById(pisoId);
                    if (piso && piso.actionsData) {
                        actionsData = piso.actionsData;
                        console.log('Dados carregados via window.opener');
                    }
                } catch (e) {
                    console.warn('Erro ao carregar via window.opener:', e);
                }
            }

            // Step 2: Fallback to sessionStorage (v6 Bridge)
            if (!actionsData && pisoId) {
                const stored = sessionStorage.getItem(`zonas_input_${pisoId}`);
                if (stored) {
                    try {
                        actionsData = JSON.parse(stored);
                        console.log('Dados carregados via sessionStorage bridge');
                        // Optional: Clear temporary storage
                        // sessionStorage.removeItem(`zonas_input_${pisoId}`); 
                    } catch (e) {
                        console.error('Erro ao ler sessionStorage:', e);
                    }
                }
            }

            // Step 3: Process the data
            if (actionsData) {
                // Load blueprint
                if (actionsData.blueprint && actionsData.blueprint.image) {
                    scale = actionsData.blueprint.scale || 1;
                    img.onload = () => {
                        canvas.width = container.clientWidth;
                        canvas.height = container.clientHeight;
                        resetView();
                    };
                    img.src = actionsData.blueprint.image;
                }
                // Load layers
                if (actionsData.layers) {
                    layers = actionsData.layers;
                    // Rebuild layerMeta from loaded data
                    layerMeta = {};
                    for (let layerName in layers) {
                        // Infer type from layer content
                        if (layerName === 'Estrutura' || layerName.includes('Espessuras')) {
                            layerMeta[layerName] = { type: 'struct' };
                        } else if (layerName === 'Sobrecargas' || layerName.includes('Sobrecarga')) {
                            layerMeta[layerName] = { type: 'sc' };
                        } else if (layerName === 'RCP' || layerName.includes('RP')) {
                            layerMeta[layerName] = { type: 'other' };
                        } else {
                            layerMeta[layerName] = { type: 'other' };
                        }
                    }
                    updateLayerSel();
                    updateZoneList();
                    redraw();
                }
            }
        }, 100); // Delay fallback to give postMessage priority

        updateLayerSel();
        resetView(); 
    </script>
</body>
